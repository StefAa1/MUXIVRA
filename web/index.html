<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUXIVRA — SSH workspace</title>
<link rel="icon" href="/static/favicon.ico?v=0.5.2" sizes="any" />
  <link rel="apple-touch-icon" href="/static/logo-192.png?v=0.5.2" />
<link rel="stylesheet" href="/static/vendor/xterm.css?v=0.1.0" />
<link rel="stylesheet" href="/static/styles.css?v=0.5.2" />
  <link rel="stylesheet" href="/static/wizard.css?v=0.5.2" />
  <link rel="stylesheet" href="/static/config.css?v=0.5.2" />
  <link rel="stylesheet" href="/static/inventory.css?v=0.5.2" />
  <link rel="stylesheet" href="/static/diagram.css?v=0.5.2" />
</head>
<body>
<!-- ============================ AUTH ============================ -->
<section id="auth" class="auth hidden">
  <div class="auth-grid" aria-hidden="true"></div>
  <div class="auth-card">
    <div class="brand"><span class="brand-mark">▚</span><span class="brand-word">MUXI<span>VRA</span></span></div>
    <p class="auth-tag" id="auth-tag">SSH, Telnet and COM — one control room.</p>
    <form id="auth-form" autocomplete="off">
      <label class="field">
        <span id="auth-label">Master password</span>
        <input id="auth-password" type="password" required minlength="8" autocomplete="current-password" placeholder="••••••••" />
      </label>
      <label class="field hidden" id="auth-confirm-wrap">
        <span>Repeat password</span>
        <input id="auth-password2" type="password" autocomplete="new-password" placeholder="••••••••" />
      </label>
      <button class="btn primary wide" id="auth-submit" type="submit">Sign in</button>
      <p class="auth-note" id="auth-message"></p>
    </form>
    <p class="auth-foot">Self-hosted · vault encrypted locally · no cloud</p>
  </div>
</section>

<!-- ============================= APP ============================= -->
<div id="app" class="app hidden">
  <nav class="rail">
    <div class="rail-logo" title="MUXIVRA"><img src="/static/logo-64.png?v=0.5.2" alt="MUXIVRA" width="34" height="34" /></div>
    <button class="rail-btn active" data-view="hosts" title="Servers"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg><em>Hosts</em></button>
    <button class="rail-btn" data-view="keys" title="Keys"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M17 12v4M20 12v3"/></svg><em>Keys</em></button>
    <button class="rail-btn" data-view="snippets" title="Snippets"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg><em>Snips</em></button>
    <button class="rail-btn" data-view="racks" title="Racks &amp; cables"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg><em>Racks</em></button>
    <button class="rail-btn" data-view="diagram" title="Network diagram"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="7" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M8 7l8 .5M7 8l4 8M17 9l-4 7"/></svg><em>Graph</em></button>
    <button class="rail-btn" data-view="activity" title="Activity"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><em>Log</em></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="btn-sftp" title="Files (SFTP)"><svg viewBox="0 0 24 24"><path d="M8 4v12M8 16l-3-3M8 16l3-3M16 20V8M16 8l-3 3M16 8l3 3"/></svg><em>Files</em></button>
    <button class="rail-btn" data-view="settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h4M13 17h7"/><circle cx="15" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg><em>Setup</em></button>
  </nav>

  <aside class="sidebar">
    <header class="sb-head">
      <div class="search">
        <span class="search-icon">⌕</span>
        <input id="search" placeholder="Search server or tag…" autocomplete="off" />
        <kbd class="kbd-shortcut">Ctrl K</kbd>
      </div>
    </header>
    <div class="sb-actions">
      <button class="btn primary sm" id="btn-add-host">+ New connection</button>
      <button class="btn ghost sm" id="btn-import" title="Import from ~/.ssh/config">⇩ Import</button>
    </div>
    <div class="sb-list" id="host-list"></div>
    <footer class="sb-foot">
      <div class="sb-user"><span class="dot ok"></span><span id="sb-user">admin</span></div>
      <button class="btn ghost xs" id="btn-logout">Sign out</button>
    </footer>
  </aside>

  <main class="main">
    <div class="context-strip" id="context-strip">
      <div class="cust-bar">
        <label class="cust-pick">
          <span>Customer</span>
          <div class="ctx-group">
            <i class="ctx-dot" id="ctx-dot"></i>
            <select id="customer-select" aria-label="Active customer" class="ctx-native"></select>
            <button type="button" class="ctx-pill" id="customer-pill" aria-haspopup="listbox" aria-expanded="false">
              <span id="customer-pill-name">—</span><i class="ctx-caret">▾</i>
            </button>
            <div class="ctx-menu hidden" id="customer-menu" role="listbox"></div>
            <button class="ctx-add" id="customer-add" title="Add a customer">+ Customer</button>
          </div>
        </label>
      </div>
      <label class="ctx-pick"><span>Site</span>
        <select id="site-select" aria-label="Site filter"></select></label>
      <div class="ctx-search">
        <input id="device-search" placeholder="Search device (name, IP, model)" autocomplete="off" spellcheck="false" />
        <span class="ctx-count" id="device-count"></span>
      </div>
      <button class="btn primary" id="btn-add-device">Add device</button>
    </div>

    <div class="tabs" id="tabs">
      <div class="tabs-list" id="tabs-list"></div>
      <button class="tab-add" id="tab-add" title="New session">+</button>
      <div class="tabs-fill"></div>
      <div class="tab-tools">
        <button class="icon-btn" id="btn-files-inline" title="SFTP"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v12M8 16l-3-3M8 16l3-3M16 20V8M16 8l-3 3M16 8l3 3"/></svg></button>
        <button class="btn ghost xs" id="btn-split" aria-pressed="false" title="Show the diagram next to the terminal">Diagram side-by-side</button>
        <button class="icon-btn" id="btn-snippets-inline" title="Snippets"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg></button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="terminals" id="terminals"></div>
      <div class="split-handle hidden" id="split-handle" title="Drag to resize"></div>
      <div class="split-pane hidden" id="split-pane"></div>

      <section class="page" id="page-hosts">
        <div class="hero">
          <div class="hero-grid" aria-hidden="true"></div>
          <h1>Your network,<br /><span>one workspace.</span></h1>
          <p>Terminal, SFTP and keys for every server — self-hosted, encrypted, no cloud.</p>
          <div class="hero-actions">
            <button class="btn primary" id="hero-add">+ New connection</button>
            <button class="btn ghost" id="hero-import">⇩ Import ~/.ssh/config</button>
            <button class="btn ghost" id="hero-palette">Ctrl K Quick connect</button>
          </div>
          <div class="stats" id="hero-stats"></div>
        </div>
        <div class="recent" id="hero-recent"></div>
      </section>

      <section class="page hidden" id="page-wizard"><div id="wizard-host"></div></section>
      <section class="page hidden" id="page-config"><div id="config-page"></div></section>
      <section class="page hidden" id="page-keys"></section>
      <section class="page hidden" id="page-snippets"></section>
      <section class="page hidden" id="page-activity"></section>
      <section class="page hidden" id="page-racks"></section>
      <section class="page hidden" id="page-diagram"></section>
      <section class="page hidden" id="page-settings"></section>
    </div>

    <div class="statusbar" id="statusbar">
      <span id="status-main">Ready</span>
      <span class="spacer"></span>
      <span id="status-fp" class="mono"></span>
      <span id="status-size" class="mono"></span>
    </div>
  </main>

  <aside class="drawer" id="drawer">
    <header class="drawer-head">
      <div>
        <h2>Files</h2>
        <p id="sftp-host" class="muted">—</p>
      </div>
      <button class="icon-btn" id="sftp-close">✕</button>
    </header>
    <div class="drawer-tools">
      <button class="btn ghost xs" id="sftp-up">↑ Up</button>
      <button class="btn ghost xs" id="sftp-refresh">Refresh</button>
      <button class="btn ghost xs" id="sftp-upload">Upload</button>
      <button class="btn ghost xs" id="sftp-mkdir">+ Folder</button>
      <input id="sftp-path" class="path-input mono" value="." spellcheck="false" />
    </div>
    <div class="sftp-list" id="sftp-list"></div>
    <input type="file" id="sftp-file" class="hidden" />
  </aside>
</div>

<!-- ======================= MODAL / PALETTE ======================= -->
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="palette-backdrop hidden" id="palette-backdrop">
  <div class="palette">
    <input id="palette-input" placeholder="Type to connect… (server, hostname, tag)" autocomplete="off" />
    <div class="palette-list" id="palette-list"></div>
    <div class="palette-hint"><kbd>↑↓</kbd> select <kbd>↵</kbd> connect <kbd>esc</kbd> close</div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/static/vendor/xterm.js?v=0.1.0"></script>
<script src="/static/vendor/addon-fit.js?v=0.1.0"></script>
<script src="/static/app.js?v=0.5.2"></script>
<script src="/static/wizard.js?v=0.5.2"></script>
<script src="/static/config.js?v=0.5.2"></script>
<script src="/static/inventory.js?v=0.5.2"></script>
<script src="/static/diagram.js?v=0.5.2"></script>
<script src="/static/shell.js?v=0.5.2"></script>
</body>
</html>
